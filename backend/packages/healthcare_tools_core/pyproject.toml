[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-tools-core"
version = "0.1.0"
description = "Shared healthcare tool execution logic for backend and MCP runtimes."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
