AWSTemplateFormatVersion: "2010-09-09"
Description: AWS foundation resources for dstrmaysam healthcare knowledge multi-agent dev.

Parameters:
  BaseName:
    Type: String
    Default: dstrmaysam-healthcare-knowledge-multi-agent-dev
    Description: Full dev resource name used where AWS physical-name limits allow it.
  ShortName:
    Type: String
    Default: dstrmaysam-hkm-dev
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: Short physical name for AWS resources with strict name limits, such as OpenSearch Serverless policies and IAM roles.
  ProjectTag:
    Type: String
    Default: dstrmaysam-healthcare-knowledge-multi-agent
  ApplicationTag:
    Type: String
    Default: dstrmaysam
  OwnerTag:
    Type: String
    Default: Sabin
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: CIDR block for the isolated VPC created for private RDS networking.
  PrivateSubnetOneCidr:
    Type: String
    Default: 10.40.1.0/24
    Description: CIDR block for the first private RDS subnet.
  PrivateSubnetTwoCidr:
    Type: String
    Default: 10.40.2.0/24
    Description: CIDR block for the second private RDS subnet.
  DatabaseIngressCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: CIDR allowed to connect to RDS Postgres on 5432 until ECS service security groups are created.
  DatabaseName:
    Type: String
    Default: healthcare_agent
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseUsername:
    Type: String
    Default: healthcare_agent
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1024
  OpenSearchCollectionName:
    Type: String
    Default: dstrmaysam-hkm-dev
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: OpenSearch Serverless collection name. The full base name is too long for collection-name limits.

Resources:
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BaseName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${BaseName}/app"
      Description: App auth/session secret for the healthcare knowledge multi-agent dev backend.
      SecretString: |
        {
          "session_secret": "replace-with-long-random-value",
          "auth_users": {
            "admin": "replace-with-password-hashpbkdf2_sha256$1000$436e10a3455a383cd122f9fee62bb2d9$55a52972c1069e44b24076f738daa09c01dbfd9a44a6356c50809d3008a1eae3"
          },
          "user_profiles": {
            "admin": {
              "roles": ["admin", "doctor"],
              "departments": ["clinical_governance"]
            }
          }
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  AzureOpenAISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${BaseName}/azure-openai"
      Description: Azure OpenAI credentials and deployment names for dev.
      SecretString: |
        {
          "endpoint": "https://YOUR-RESOURCE.openai.azure.com/",
          "api_key": "replace-with-azure-openai-key",
          "api_version": "2025-04-01-preview",
          "chat_deployment": "gpt-4.1-mini",
          "fast_chat_deployment": "gpt-4.1-mini",
          "embedding_deployment": "text-embedding-3-small"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  LangfuseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${BaseName}/langfuse"
      Description: Langfuse credentials for dev tracing and evaluation.
      SecretString: |
        {
          "public_key": "pk-lf-replace",
          "secret_key": "sk-lf-replace",
          "base_url": "https://cloud.langfuse.com"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FoundationVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-vpc"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref PrivateSubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-private-a"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref PrivateSubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-private-b"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FoundationVpc
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-private-rt"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetOne
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetTwo
      RouteTableId: !Ref PrivateRouteTable

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${BaseName} RDS Postgres access"
      VpcId: !Ref FoundationVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref DatabaseIngressCidr
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-rds"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${BaseName} private database subnets"
      SubnetIds:
        - !Ref PrivateSubnetOne
        - !Ref PrivateSubnetTwo
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Ref BaseName
      Engine: postgres
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ShortName}-enc"
      Type: encryption
      Policy: !Sub |
        {
          "Rules": [
            {
              "ResourceType": "collection",
              "Resource": ["collection/${OpenSearchCollectionName}"]
            }
          ],
          "AWSOwnedKey": true
        }

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ShortName}-net"
      Type: network
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${OpenSearchCollectionName}"]
              },
              {
                "ResourceType": "dashboard",
                "Resource": ["collection/${OpenSearchCollectionName}"]
              }
            ],
            "AllowFromPublic": true
          }
        ]

  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
    Properties:
      Name: !Ref OpenSearchCollectionName
      Type: VECTORSEARCH
      Description: !Sub "${BaseName} vector search collection"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: FullName
          Value: !Ref BaseName

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ShortName}-ecs-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadInjectedRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Join ["", [!GetAtt Database.MasterUserSecret.SecretArn, "*"]]
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ShortName}-backend-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BackendRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRequiredSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/app-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/azure-openai-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/langfuse-*"
              - Sid: WriteAppUserSecret
                Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/app-*"
              - Sid: ReadWriteKnowledgeBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${KnowledgeBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${KnowledgeBucket}/*"
              - Sid: OpenSearchServerlessAccess
                Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !GetAtt OpenSearchCollection.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ShortName}-frontend-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${ShortName}-data"
      Type: data
      Policy: !Sub |
        [
          {
            "Description": "${BaseName} backend access",
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${OpenSearchCollectionName}"],
                "Permission": [
                  "aoss:CreateCollectionItems",
                  "aoss:DeleteCollectionItems",
                  "aoss:UpdateCollectionItems",
                  "aoss:DescribeCollectionItems"
                ]
              },
              {
                "ResourceType": "index",
                "Resource": ["index/${OpenSearchCollectionName}/*"],
                "Permission": [
                  "aoss:CreateIndex",
                  "aoss:DeleteIndex",
                  "aoss:UpdateIndex",
                  "aoss:DescribeIndex",
                  "aoss:ReadDocument",
                  "aoss:WriteDocument"
                ]
              }
            ],
            "Principal": [
              "${BackendTaskRole.Arn}"
            ]
          }
        ]

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref BaseName
      EmptyOnDelete: true
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the latest 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref BaseName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${BaseName}/backend"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${BaseName}/frontend"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

Outputs:
  BaseName:
    Value: !Ref BaseName
  VpcId:
    Value: !Ref FoundationVpc
  PrivateSubnetOneId:
    Value: !Ref PrivateSubnetOne
  PrivateSubnetTwoId:
    Value: !Ref PrivateSubnetTwo
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  KnowledgeBucketName:
    Value: !Ref KnowledgeBucket
  AppSecretName:
    Value: !Sub "/${BaseName}/app"
  AzureOpenAISecretName:
    Value: !Sub "/${BaseName}/azure-openai"
  LangfuseSecretName:
    Value: !Sub "/${BaseName}/langfuse"
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: !Ref DatabaseName
  DatabaseUsername:
    Value: !Ref DatabaseUsername
  DatabaseMasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  OpenSearchCollectionName:
    Value: !Ref OpenSearchCollectionName
  OpenSearchCollectionEndpoint:
    Value: !GetAtt OpenSearchCollection.CollectionEndpoint
  OpenSearchDashboardEndpoint:
    Value: !GetAtt OpenSearchCollection.DashboardEndpoint
  OpenSearchIndexName:
    Value: !Ref BaseName
  EcrRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  EcsClusterName:
    Value: !Ref EcsCluster
  EcsExecutionRoleArn:
    Value: !GetAtt EcsExecutionRole.Arn
  BackendTaskRoleArn:
    Value: !GetAtt BackendTaskRole.Arn
  FrontendTaskRoleArn:
    Value: !GetAtt FrontendTaskRole.Arn
  BackendLogGroupName:
    Value: !Ref BackendLogGroup
  FrontendLogGroupName:
    Value: !Ref FrontendLogGroup
