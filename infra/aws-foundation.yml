AWSTemplateFormatVersion: "2010-09-09"
Description: AWS foundation resources for dstrmaysam healthcare knowledge multi-agent dev.

Parameters:
  BaseName:
    Type: String
    Default: dstrmaysam-healthcare-knowledge-multi-agent-dev
    Description: Full dev resource name used where AWS physical-name limits allow it.
  ShortName:
    Type: String
    Default: dstrmaysam-hkm-dev
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: Short physical name for AWS resources with strict name limits, such as OpenSearch Serverless policies and IAM roles.
  ProjectTag:
    Type: String
    Default: dstrmaysam-healthcare-knowledge-multi-agent
  ApplicationTag:
    Type: String
    Default: dstrmaysam
  OwnerTag:
    Type: String
    Default: Sabin
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: CIDR block for the isolated VPC created for private RDS networking.
  PrivateSubnetOneCidr:
    Type: String
    Default: 10.40.1.0/24
    Description: CIDR block for the first private RDS subnet.
  PrivateSubnetTwoCidr:
    Type: String
    Default: 10.40.2.0/24
    Description: CIDR block for the second private RDS subnet.
  PublicSubnetOneCidr:
    Type: String
    Default: 10.40.10.0/24
    Description: CIDR block for the first public subnet used by the ALB and optional Fargate dev services.
  PublicSubnetTwoCidr:
    Type: String
    Default: 10.40.11.0/24
    Description: CIDR block for the second public subnet used by the ALB and optional Fargate dev services.
  DbAdminAccessEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create an SSM-managed admin instance for local PowerShell port-forward access to private RDS.
  AdminInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the optional SSM admin instance.
  AdminAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: SSM parameter for the Amazon Linux 2023 AMI used by the optional admin instance.
  DatabaseIngressCidr:
    Type: String
    Default: 10.40.0.0/16
    Description: CIDR allowed to connect to RDS Postgres on 5432 until ECS service security groups are created.
  DatabaseName:
    Type: String
    Default: healthcare_agent
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseUsername:
    Type: String
    Default: healthcare_agent
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
  DatabaseAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1024
  OpenSearchCollectionName:
    Type: String
    Default: dstrmaysam-hkm-dev
    AllowedPattern: "^[a-z][a-z0-9-]{2,31}$"
    Description: OpenSearch Serverless collection name. The full base name is too long for collection-name limits.
  CicdEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create dev ECS services plus CodePipeline, CodeBuild, and CodeDeploy resources.
  CodeStarConnectionArn:
    Type: String
    Default: ""
    Description: CodeStar Connections ARN for the GitHub repository. Required when CicdEnabled is true and the pipeline should be created.
  RepositoryId:
    Type: String
    Default: ""
    Description: GitHub repository in owner/repo form for the CodePipeline source action.
  RepositoryBranch:
    Type: String
    Default: main
    Description: Git branch used by the CodePipeline source action.
  PublicIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access the dev ALB listeners. Narrow this to your office/VPN IP range where possible.
  BackendDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 5
  FrontendDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 5

Conditions:
  CreateDbAdminAccess: !Equals [!Ref DbAdminAccessEnabled, "true"]
  CreateCicd: !Equals [!Ref CicdEnabled, "true"]
  HasCodeStarConnection: !Not [!Equals [!Ref CodeStarConnectionArn, ""]]
  HasRepositoryId: !Not [!Equals [!Ref RepositoryId, ""]]
  CreatePipeline: !And
    - !Condition CreateCicd
    - !Condition HasCodeStarConnection
    - !Condition HasRepositoryId
  CreatePublicNetworking: !Or
    - !Condition CreateCicd
    - !Condition CreateDbAdminAccess

Resources:
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BaseName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${BaseName}/app"
      Description: App auth/session secret for the healthcare knowledge multi-agent dev backend.
      SecretString: |
        {
          "session_secret": "replace-with-long-random-value",
          "auth_users": {
            "admin": "pbkdf2_sha256$1000$436e10a3455a383cd122f9fee62bb2d9$55a52972c1069e44b24076f738daa09c01dbfd9a44a6356c50809d3008a1eae3"
          },
          "user_profiles": {
            "admin": {
              "roles": ["admin", "doctor"],
              "departments": ["clinical_governance"]
            }
          }
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  AzureOpenAISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${BaseName}/azure-openai"
      Description: Azure OpenAI credentials and deployment names for dev.
      SecretString: |
        {
          "endpoint": "https://YOUR-RESOURCE.openai.azure.com/",
          "api_key": "replace-with-azure-openai-key",
          "api_version": "2025-04-01-preview",
          "chat_deployment": "gpt-4.1-mini",
          "fast_chat_deployment": "gpt-4.1-mini",
          "embedding_deployment": "text-embedding-3-small"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  LangfuseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${BaseName}/langfuse"
      Description: Langfuse credentials for dev tracing and evaluation.
      SecretString: |
        {
          "public_key": "pk-lf-replace",
          "secret_key": "sk-lf-replace",
          "base_url": "https://cloud.langfuse.com"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FoundationVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-vpc"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref PrivateSubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-private-a"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref PrivateSubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-private-b"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FoundationVpc
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-private-rt"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PrivateSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetOne
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetTwo
      RouteTableId: !Ref PrivateRouteTable

  FoundationInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreatePublicNetworking
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-igw"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FoundationVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreatePublicNetworking
    Properties:
      VpcId: !Ref FoundationVpc
      InternetGatewayId: !Ref FoundationInternetGateway

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicNetworking
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref PublicSubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-public-a"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Condition: CreatePublicNetworking
    Properties:
      VpcId: !Ref FoundationVpc
      CidrBlock: !Ref PublicSubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-public-b"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreatePublicNetworking
    Properties:
      VpcId: !Ref FoundationVpc
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-public-rt"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreatePublicNetworking
    DependsOn: FoundationVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref FoundationInternetGateway

  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicNetworking
    Properties:
      SubnetId: !Ref PublicSubnetOne
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreatePublicNetworking
    Properties:
      SubnetId: !Ref PublicSubnetTwo
      RouteTableId: !Ref PublicRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref FoundationVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ListProjectBucket
            Effect: Allow
            Principal: "*"
            Action:
              - s3:ListBucket
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${KnowledgeBucket}"
          - Sid: ReadWriteProjectBucketObjects
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${KnowledgeBucket}/*"

  DbAdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateDbAdminAccess
    Properties:
      GroupDescription: !Sub "${BaseName} SSM admin instance egress"
      VpcId: !Ref FoundationVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-db-admin"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DbAdminInstanceRole:
    Type: AWS::IAM::Role
    Condition: CreateDbAdminAccess
    Properties:
      RoleName: !Sub "${ShortName}-db-admin-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DbAdminInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateDbAdminAccess
    Properties:
      InstanceProfileName: !Sub "${ShortName}-db-admin-profile"
      Roles:
        - !Ref DbAdminInstanceRole

  DbAdminInstance:
    Type: AWS::EC2::Instance
    Condition: CreateDbAdminAccess
    Properties:
      ImageId: !Ref AdminAmiId
      InstanceType: !Ref AdminInstanceType
      IamInstanceProfile: !Ref DbAdminInstanceProfile
      SubnetId: !Ref PublicSubnetOne
      SecurityGroupIds:
        - !Ref DbAdminSecurityGroup
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-db-admin"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${BaseName} RDS Postgres access"
      VpcId: !Ref FoundationVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref DatabaseIngressCidr
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-rds"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${BaseName} private database subnets"
      SubnetIds:
        - !Ref PrivateSubnetOne
        - !Ref PrivateSubnetTwo
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Ref BaseName
      Engine: postgres
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ShortName}-enc"
      Type: encryption
      Policy: !Sub |
        {
          "Rules": [
            {
              "ResourceType": "collection",
              "Resource": ["collection/${OpenSearchCollectionName}"]
            }
          ],
          "AWSOwnedKey": true
        }

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ShortName}-net"
      Type: network
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${OpenSearchCollectionName}"]
              },
              {
                "ResourceType": "dashboard",
                "Resource": ["collection/${OpenSearchCollectionName}"]
              }
            ],
            "AllowFromPublic": true
          }
        ]

  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
    Properties:
      Name: !Ref OpenSearchCollectionName
      Type: VECTORSEARCH
      Description: !Sub "${BaseName} vector search collection"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: FullName
          Value: !Ref BaseName

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ShortName}-ecs-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadInjectedRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Join ["", [!GetAtt Database.MasterUserSecret.SecretArn, "*"]]
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ShortName}-backend-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BackendRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRequiredSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/app-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/azure-openai-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/langfuse-*"
              - Sid: WriteAppUserSecret
                Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${BaseName}/app-*"
              - Sid: ReadWriteKnowledgeBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${KnowledgeBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${KnowledgeBucket}/*"
              - Sid: OpenSearchServerlessAccess
                Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !GetAtt OpenSearchCollection.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ShortName}-frontend-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${ShortName}-data"
      Type: data
      Policy: !Sub |
        [
          {
            "Description": "${BaseName} backend access",
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/${OpenSearchCollectionName}"],
                "Permission": [
                  "aoss:CreateCollectionItems",
                  "aoss:DeleteCollectionItems",
                  "aoss:UpdateCollectionItems",
                  "aoss:DescribeCollectionItems"
                ]
              },
              {
                "ResourceType": "index",
                "Resource": ["index/${OpenSearchCollectionName}/*"],
                "Permission": [
                  "aoss:CreateIndex",
                  "aoss:DeleteIndex",
                  "aoss:UpdateIndex",
                  "aoss:DescribeIndex",
                  "aoss:ReadDocument",
                  "aoss:WriteDocument"
                ]
              }
            ],
            "Principal": [
              "${BackendTaskRole.Arn}"
            ]
          }
        ]

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref BaseName
      EmptyOnDelete: true
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the latest 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref BaseName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${BaseName}/backend"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${BaseName}/frontend"
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCicd
    Properties:
      GroupDescription: !Sub "${BaseName} dev ALB ingress"
      VpcId: !Ref FoundationVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref PublicIngressCidr
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref PublicIngressCidr
        - IpProtocol: tcp
          FromPort: 9000
          ToPort: 9000
          CidrIp: !Ref PublicIngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-alb"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  AppTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateCicd
    Properties:
      GroupDescription: !Sub "${BaseName} dev ECS task ingress from ALB"
      VpcId: !Ref FoundationVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${BaseName}-tasks"
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DevApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: CreateCicd
    Properties:
      Name: !Sub "${ShortName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnetOne
        - !Ref PublicSubnetTwo
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag
        - Key: FullName
          Value: !Ref BaseName

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateCicd
    Properties:
      Name: !Sub "${ShortName}-be"
      VpcId: !Ref FoundationVpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendBlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateCicd
    Properties:
      Name: !Sub "${ShortName}-fe-blue"
      VpcId: !Ref FoundationVpc
      TargetType: ip
      Protocol: HTTP
      Port: 8501
      HealthCheckPath: /_stcore/health
      Matcher:
        HttpCode: "200-399"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendGreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateCicd
    Properties:
      Name: !Sub "${ShortName}-fe-green"
      VpcId: !Ref FoundationVpc
      TargetType: ip
      Protocol: HTTP
      Port: 8501
      HealthCheckPath: /_stcore/health
      Matcher:
        HttpCode: "200-399"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateCicd
    Properties:
      LoadBalancerArn: !Ref DevApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendBlueTargetGroup

  FrontendTestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateCicd
    Properties:
      LoadBalancerArn: !Ref DevApplicationLoadBalancer
      Port: 9000
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendGreenTargetGroup

  BackendListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateCicd
    Properties:
      LoadBalancerArn: !Ref DevApplicationLoadBalancer
      Port: 8000
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateCicd
    Properties:
      Family: !Sub "${BaseName}-backend"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Join [":", [!GetAtt ImageRepository.RepositoryUri, "backend-latest"]]
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: dev
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: SECRETS_STAGE
              Value: dev
            - Name: APP_SECRET_NAME
              Value: !Sub "/${BaseName}/app"
            - Name: AZURE_OPENAI_SECRET_NAME
              Value: !Sub "/${BaseName}/azure-openai"
            - Name: AZURE_OPENAI_DEPLOYMENT
              Value: gpt-4.1-mini
            - Name: LANGFUSE_SECRET_NAME
              Value: !Sub "/${BaseName}/langfuse"
            - Name: S3_BUCKET
              Value: !Ref KnowledgeBucket
            - Name: S3_RAW_PREFIX
              Value: raw/
            - Name: S3_MANIFEST_KEY
              Value: manifests/documents.json
            - Name: OPENSEARCH_ENDPOINT
              Value: !GetAtt OpenSearchCollection.CollectionEndpoint
            - Name: OPENSEARCH_INDEX
              Value: !Ref BaseName
            - Name: CHAT_HISTORY_BACKEND
              Value: postgres
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_DB
              Value: !Ref DatabaseName
            - Name: POSTGRES_USER
              Value: !Ref DatabaseUsername
            - Name: POSTGRES_SSLMODE
              Value: require
            - Name: LOCAL_TEST_ADMIN_ENABLED
              Value: "false"
            - Name: TOOL_EXECUTION_MODE
              Value: local
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Join ["", [!GetAtt Database.MasterUserSecret.SecretArn, ":password::"]]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateCicd
    Properties:
      Family: !Sub "${BaseName}-frontend"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt FrontendTaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Join [":", [!GetAtt ImageRepository.RepositoryUri, "frontend-latest"]]
          Essential: true
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          Environment:
            - Name: BACKEND_URL
              Value: !Sub "http://${DevApplicationLoadBalancer.DNSName}:8000"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  DbInitTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateCicd
    Properties:
      Family: !Sub "${BaseName}-db-init"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: db-init
          Image: !Join [":", [!GetAtt ImageRepository.RepositoryUri, "db-init-latest"]]
          Essential: true
          Environment:
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_PORT
              Value: "5432"
            - Name: POSTGRES_DB
              Value: !Ref DatabaseName
            - Name: POSTGRES_USER
              Value: !Ref DatabaseUsername
            - Name: POSTGRES_SSLMODE
              Value: require
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Join ["", [!GetAtt Database.MasterUserSecret.SecretArn, ":password::"]]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: db-init

  BackendService:
    Type: AWS::ECS::Service
    Condition: CreateCicd
    DependsOn:
      - BackendListener
    Properties:
      ServiceName: !Sub "${BaseName}-backend"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: !Ref BackendDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AppTaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref BackendTargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendService:
    Type: AWS::ECS::Service
    Condition: CreateCicd
    DependsOn:
      - FrontendProdListener
    Properties:
      ServiceName: !Sub "${BaseName}-frontend"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: !Ref FrontendDesiredCount
      LaunchType: FARGATE
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AppTaskSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 8501
          TargetGroupArn: !Ref FrontendBlueTargetGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Condition: CreateCicd
    Properties:
      RoleName: !Sub "${ShortName}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendCodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Condition: CreateCicd
    Properties:
      ApplicationName: !Sub "${BaseName}-frontend"
      ComputePlatform: ECS
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  FrontendCodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Condition: CreateCicd
    DependsOn:
      - FrontendService
    Properties:
      ApplicationName: !Ref FrontendCodeDeployApplication
      DeploymentGroupName: !Sub "${BaseName}-frontend"
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: !Ref EcsCluster
          ServiceName: !GetAtt FrontendService.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !GetAtt FrontendBlueTargetGroup.TargetGroupName
              - Name: !GetAtt FrontendGreenTargetGroup.TargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref FrontendProdListener
            TestTrafficRoute:
              ListenerArns:
                - !Ref FrontendTestListener
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  CodePipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Condition: CreatePipeline
    Properties:
      BucketName: !Sub "${BaseName}-pipeline"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Condition: CreatePipeline
    Properties:
      RoleName: !Sub "${ShortName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildAndPackageImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:GetAuthorizationToken
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: "*"
              - Sid: DescribeFrontendTaskDefinition
                Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: RunDatabaseInitTask
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:RunTask
                Resource: "*"
              - Sid: PassDatabaseInitRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt EcsExecutionRole.Arn
                  - !GetAtt BackendTaskRole.Arn
              - Sid: PipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${CodePipelineArtifactBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${CodePipelineArtifactBucket}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  PipelineBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: CreatePipeline
    Properties:
      Name: !Sub "${BaseName}-build"
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            pre_build:
              commands:
                - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
                - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi
                - IMAGE_TAG=$(echo "$IMAGE_TAG" | cut -c1-12)
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
            build:
              commands:
                - docker build -t $ECR_REPOSITORY_URI:backend-$IMAGE_TAG backend
                - docker build -t $ECR_REPOSITORY_URI:frontend-$IMAGE_TAG frontend
                - docker build -t $ECR_REPOSITORY_URI:db-init-$IMAGE_TAG -f infra/db-init/Dockerfile .
            post_build:
              commands:
                - docker push $ECR_REPOSITORY_URI:backend-$IMAGE_TAG
                - docker push $ECR_REPOSITORY_URI:frontend-$IMAGE_TAG
                - docker push $ECR_REPOSITORY_URI:db-init-$IMAGE_TAG
                - docker tag $ECR_REPOSITORY_URI:db-init-$IMAGE_TAG $ECR_REPOSITORY_URI:db-init-latest
                - docker push $ECR_REPOSITORY_URI:db-init-latest
                - DB_INIT_NETWORK="awsvpcConfiguration={subnets=[$DB_INIT_SUBNET_ONE,$DB_INIT_SUBNET_TWO],securityGroups=[$DB_INIT_SECURITY_GROUP],assignPublicIp=ENABLED}"
                - DB_INIT_TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER_NAME" --task-definition "$DB_INIT_TASK_DEFINITION" --launch-type FARGATE --network-configuration "$DB_INIT_NETWORK" --query 'tasks[0].taskArn' --output text)
                - test "$DB_INIT_TASK_ARN" != "None"
                - aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER_NAME" --tasks "$DB_INIT_TASK_ARN"
                - DB_INIT_EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER_NAME" --tasks "$DB_INIT_TASK_ARN" --query 'tasks[0].containers[?name==`db-init`].exitCode | [0]' --output text)
                - test "$DB_INIT_EXIT_CODE" = "0"
                - printf '[{"name":"backend","imageUri":"%s"}]' "$ECR_REPOSITORY_URI:backend-$IMAGE_TAG" > backend-imagedefinitions.json
                - printf '{"ImageURI":"%s"}' "$ECR_REPOSITORY_URI:frontend-$IMAGE_TAG" > imageDetail.json
                - aws ecs describe-task-definition --task-definition "$FRONTEND_TASK_DEFINITION" --query taskDefinition > current-frontend-taskdef.json
                - |
                  python - <<'PY'
                  import json

                  with open("current-frontend-taskdef.json", "r", encoding="utf-8") as handle:
                      task_definition = json.load(handle)

                  for key in (
                      "taskDefinitionArn",
                      "revision",
                      "status",
                      "requiresAttributes",
                      "compatibilities",
                      "registeredAt",
                      "registeredBy",
                  ):
                      task_definition.pop(key, None)

                  for container in task_definition.get("containerDefinitions", []):
                      if container.get("name") == "frontend":
                          container["image"] = "<IMAGE1_NAME>"

                  with open("frontend-taskdef.json", "w", encoding="utf-8") as handle:
                      json.dump(task_definition, handle)

                  appspec = {
                      "version": 1,
                      "Resources": [
                          {
                              "TargetService": {
                                  "Type": "AWS::ECS::Service",
                                  "Properties": {
                                      "TaskDefinition": "<TASK_DEFINITION>",
                                      "LoadBalancerInfo": {
                                          "ContainerName": "frontend",
                                          "ContainerPort": 8501,
                                      },
                                  },
                              }
                          }
                      ],
                  }
                  with open("frontend-appspec.yaml", "w", encoding="utf-8") as handle:
                      json.dump(appspec, handle)
                  PY
          artifacts:
            files:
              - backend-imagedefinitions.json
              - imageDetail.json
              - frontend-taskdef.json
              - frontend-appspec.yaml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPOSITORY_URI
            Value: !GetAtt ImageRepository.RepositoryUri
          - Name: FRONTEND_TASK_DEFINITION
            Value: !Ref FrontendTaskDefinition
          - Name: ECS_CLUSTER_NAME
            Value: !Ref EcsCluster
          - Name: DB_INIT_TASK_DEFINITION
            Value: !Ref DbInitTaskDefinition
          - Name: DB_INIT_SUBNET_ONE
            Value: !Ref PublicSubnetOne
          - Name: DB_INIT_SUBNET_TWO
            Value: !Ref PublicSubnetTwo
          - Name: DB_INIT_SECURITY_GROUP
            Value: !Ref AppTaskSecurityGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Condition: CreatePipeline
    Properties:
      RoleName: !Sub "${ShortName}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineDeployAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SourceConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${CodePipelineArtifactBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${CodePipelineArtifactBucket}/*"
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt PipelineBuildProject.Arn
              - Sid: EcsBackendDeploy
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Sid: PassEcsRoles
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt EcsExecutionRole.Arn
                  - !GetAtt BackendTaskRole.Arn
                  - !GetAtt FrontendTaskRole.Arn
              - Sid: CodeDeployFrontend
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

  DevCodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Condition: CreatePipeline
    Properties:
      Name: !Sub "${BaseName}-pipeline"
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref RepositoryBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: BuildAndPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref PipelineBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployBackend
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !Ref EcsCluster
                ServiceName: !GetAtt BackendService.Name
                FileName: backend-imagedefinitions.json
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
            - Name: DeployFrontend
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref FrontendCodeDeployApplication
                DeploymentGroupName: !Ref FrontendCodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: BuildOutput
                TaskDefinitionTemplatePath: frontend-taskdef.json
                AppSpecTemplateArtifact: BuildOutput
                AppSpecTemplatePath: frontend-appspec.yaml
                Image1ArtifactName: BuildOutput
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 2
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Application
          Value: !Ref ApplicationTag
        - Key: Owner
          Value: !Ref OwnerTag

Outputs:
  BaseName:
    Value: !Ref BaseName
  VpcId:
    Value: !Ref FoundationVpc
  PrivateSubnetOneId:
    Value: !Ref PrivateSubnetOne
  PrivateSubnetTwoId:
    Value: !Ref PrivateSubnetTwo
  PublicSubnetOneId:
    Condition: CreatePublicNetworking
    Value: !Ref PublicSubnetOne
  PublicSubnetTwoId:
    Condition: CreatePublicNetworking
    Value: !Ref PublicSubnetTwo
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  S3GatewayEndpointId:
    Value: !Ref S3GatewayEndpoint
  DbAdminInstanceId:
    Condition: CreateDbAdminAccess
    Value: !Ref DbAdminInstance
  KnowledgeBucketName:
    Value: !Ref KnowledgeBucket
  AppSecretName:
    Value: !Sub "/${BaseName}/app"
  AzureOpenAISecretName:
    Value: !Sub "/${BaseName}/azure-openai"
  LangfuseSecretName:
    Value: !Sub "/${BaseName}/langfuse"
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabasePort:
    Value: !GetAtt Database.Endpoint.Port
  DatabaseName:
    Value: !Ref DatabaseName
  DatabaseUsername:
    Value: !Ref DatabaseUsername
  DatabaseMasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  OpenSearchCollectionName:
    Value: !Ref OpenSearchCollectionName
  OpenSearchCollectionEndpoint:
    Value: !GetAtt OpenSearchCollection.CollectionEndpoint
  OpenSearchDashboardEndpoint:
    Value: !GetAtt OpenSearchCollection.DashboardEndpoint
  OpenSearchIndexName:
    Value: !Ref BaseName
  EcrRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  EcsClusterName:
    Value: !Ref EcsCluster
  BackendServiceName:
    Condition: CreateCicd
    Value: !GetAtt BackendService.Name
  FrontendServiceName:
    Condition: CreateCicd
    Value: !GetAtt FrontendService.Name
  DevApplicationUrl:
    Condition: CreateCicd
    Value: !Sub "http://${DevApplicationLoadBalancer.DNSName}"
  BackendApiUrl:
    Condition: CreateCicd
    Value: !Sub "http://${DevApplicationLoadBalancer.DNSName}:8000"
  DevLoadBalancerDnsName:
    Condition: CreateCicd
    Value: !GetAtt DevApplicationLoadBalancer.DNSName
  FrontendCodeDeployApplicationName:
    Condition: CreateCicd
    Value: !Ref FrontendCodeDeployApplication
  FrontendCodeDeployDeploymentGroupName:
    Condition: CreateCicd
    Value: !Ref FrontendCodeDeployDeploymentGroup
  DevCodePipelineName:
    Condition: CreatePipeline
    Value: !Ref DevCodePipeline
  EcsExecutionRoleArn:
    Value: !GetAtt EcsExecutionRole.Arn
  BackendTaskRoleArn:
    Value: !GetAtt BackendTaskRole.Arn
  FrontendTaskRoleArn:
    Value: !GetAtt FrontendTaskRole.Arn
  BackendLogGroupName:
    Value: !Ref BackendLogGroup
  FrontendLogGroupName:
    Value: !Ref FrontendLogGroup
